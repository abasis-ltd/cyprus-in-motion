<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cyprus in Motion — Show</title>
<link rel="icon" href="../assets/abasis-icon.svg">
<link rel="stylesheet" href="../expo.css">
<style>
  /* 1u = 1% of a 16:9 frame that fits the screen, so the show scales to any display */
  :root { --u: min(1vw, 1.7778vh); }
  html, body { overflow: hidden; background: var(--night); }
  body { cursor: none; }
  body.cursor { cursor: default; }
  #map { position: fixed; inset: 0; width: 100vw; height: 100vh; }

  #shade { background: radial-gradient(90% 80% at 50% 50%, rgba(15,23,42,.72), rgba(15,23,42,.92)); }
  #edge { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(130% 100% at 65% 50%, transparent 55%, rgba(15,23,42,.85) 100%); }

  header { position: fixed; top: calc(var(--u) * 2); left: calc(var(--u) * 4); right: calc(var(--u) * 4); display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  .logo { height: calc(var(--u) * 3.2); margin-left: calc(var(--u) * -.9); }
  #line { position: relative; width: calc(var(--u) * 46); height: calc(var(--u) * 3); }
  #line .rail { position: absolute; left: 0; right: 0; top: calc(var(--u) * .9); height: 2px; background: rgba(248,250,252,.18); }
  #line .stop { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .35); }
  #line .stop i { width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 50%; border: 2px solid rgba(248,250,252,.4); background: var(--night); margin-top: calc(var(--u) * .45); }
  #line .stop span { font-family: var(--mono); font-size: calc(var(--u) * .74); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

  #line .bus::before { content: ""; position: absolute; left: 12%; right: 12%; top: 22%; height: 32%; background: repeating-linear-gradient(90deg, var(--blue) 0 22%, transparent 22% 33%); }
  #clock { font-family: var(--mono); font-size: calc(var(--u) * .85); color: var(--muted); display: flex; gap: calc(var(--u) * 1.2); align-items: center; min-width: calc(var(--u) * 14); justify-content: flex-end; }

  #clock .live::before { content: ""; width: calc(var(--u) * .55); height: calc(var(--u) * .55); border-radius: 50%; background: var(--blue-mid); }

  #qr { position: fixed; right: calc(var(--u) * 3); bottom: calc(var(--u) * 2.6); z-index: 5; display: flex; align-items: center; gap: calc(var(--u) * 1); padding: calc(var(--u) * .7); padding-right: calc(var(--u) * 1.4); border-radius: calc(var(--u) * 1); background: rgba(248,250,252,.96); color: var(--on-light); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,.35); }
  #qr img { width: calc(var(--u) * 6.2); height: calc(var(--u) * 6.2); display: block; }
  #qr b { display: block; font-size: calc(var(--u) * 1.05); letter-spacing: -.01em; }
  #qr span { font-family: var(--mono); font-size: calc(var(--u) * .7); color: #475569; }

  footer { position: fixed; left: calc(var(--u) * 4); right: calc(var(--u) * 4); bottom: calc(var(--u) * 1.6); display: flex; gap: calc(var(--u) * .4); z-index: 5; }
  footer div { height: 3px; background: rgba(248,250,252,.14); border-radius: 3px; overflow: hidden; }
  footer div i { display: block; height: 100%; width: 0; background: var(--blue-soft); }
  #hint { position: fixed; bottom: calc(var(--u) * 2.4); left: calc(var(--u) * 4); font-family: var(--mono); font-size: calc(var(--u) * .7); color: var(--muted); z-index: 6; opacity: 0; }
  body.cursor #hint { opacity: 1; }

  /* scene layout */

  .scene [data-in] { opacity: 0; will-change: opacity, transform; }
  .col-left { position: absolute; left: calc(var(--u) * 5); top: 52%; transform: translateY(-50%); width: calc(var(--u) * 41); }
  .col-right { position: absolute; right: calc(var(--u) * 4); top: 49%; transform: translateY(-50%); width: calc(var(--u) * 47); }
  .center { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: calc(var(--u) * 86); text-align: center; }
  .kicker { font-size: calc(var(--u) * .92); margin-bottom: calc(var(--u) * 1.6); display: flex; align-items: center; gap: calc(var(--u) * .8); }
  .center .kicker { justify-content: center; }
  .kicker::before { content: ""; width: calc(var(--u) * 2.6); height: 2px; background: currentColor; }
  h1 { font-weight: 800; font-size: calc(var(--u) * 6.6); line-height: .92; letter-spacing: -.055em; margin: 0 0 calc(var(--u) * 2.2); }
  h2 { font-weight: 800; font-size: calc(var(--u) * 3.9); line-height: 1.02; letter-spacing: -.045em; margin: 0 0 calc(var(--u) * 1.9); }

  .steps { list-style: none; padding: 0; margin: 0 0 calc(var(--u) * 2.2); counter-reset: s; }
  .steps li { display: flex; gap: calc(var(--u) * 1.1); align-items: flex-start; font-size: calc(var(--u) * 1.32); line-height: 1.38; margin-bottom: calc(var(--u) * 1.05); }
  .steps li::before { counter-increment: s; content: counter(s); flex: none; width: calc(var(--u) * 2.1); height: calc(var(--u) * 2.1); border-radius: 50%; background: var(--blue); display: grid; place-items: center; font-family: var(--mono); font-size: calc(var(--u) * .85); font-weight: 600; margin-top: calc(var(--u) * -.15); }
  .pill { display: inline-flex; align-items: center; gap: calc(var(--u) * .6); font-family: var(--mono); font-size: calc(var(--u) * .78); padding: calc(var(--u) * .5) calc(var(--u) * 1.1); border-radius: 99px; background: rgba(147,197,253,.14); color: var(--blue-pale); border: 1px solid rgba(147,197,253,.32); margin: 0 calc(var(--u) * .6) calc(var(--u) * 1.4) 0; }
  .pill::before { content: ""; width: calc(var(--u) * .55); height: calc(var(--u) * .55); border-radius: 50%; background: var(--blue-mid); }
  .chip { display: inline-block; font-family: var(--mono); font-size: calc(var(--u) * .78); padding: calc(var(--u) * .45) calc(var(--u) * .9); border-radius: calc(var(--u) * .4); background: var(--ink); color: var(--on-light); font-weight: 600; }

  /* media frames */

  .browser .bar { height: calc(var(--u) * 2.2); display: flex; align-items: center; gap: calc(var(--u) * .5); padding: 0 calc(var(--u) * 1); background: #1e293b; }
  .browser .bar i { width: calc(var(--u) * .72); height: calc(var(--u) * .72); border-radius: 50%; background: #475569; }
  .browser .bar span { margin-left: calc(var(--u) * 1); flex: 1; height: calc(var(--u) * 1.35); border-radius: calc(var(--u) * .7); background: #0f172a; font-family: var(--mono); font-size: calc(var(--u) * .72); color: var(--text-2); display: flex; align-items: center; padding-left: calc(var(--u) * 1); }
  .browser .view { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #fff; }

  .paper { background: #fff; border-radius: calc(var(--u) * .4); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0,0,0,.5); overflow: hidden; }
  .paper img { display: block; width: 100%; }

  .phone { position: absolute; width: calc(var(--u) * 17); height: calc(var(--u) * 32); border-radius: calc(var(--u) * 2.6); border: calc(var(--u) * .55) solid #334155; background: var(--night); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0,0,0,.6); overflow: hidden; color: var(--ink); }
  .phone .ph-top { height: calc(var(--u) * 3.6); display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(var(--u) * .5); font-family: var(--mono); font-size: calc(var(--u) * .66); color: var(--muted); letter-spacing: .12em; }
  .phone .ph-card { margin: calc(var(--u) * .7) calc(var(--u) * .9); padding: calc(var(--u) * .9) calc(var(--u) * 1); border-radius: calc(var(--u) * 1); background: rgba(248,250,252,.07); }
  .phone .ph-card small { display: block; font-family: var(--mono); font-size: calc(var(--u) * .6); color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: calc(var(--u) * .3); }
  .phone .ph-card b { font-size: calc(var(--u) * 1.15); letter-spacing: -.02em; }
  .phone .ph-go { margin: calc(var(--u) * 1) calc(var(--u) * .9); padding: calc(var(--u) * 1) 0; border-radius: 99px; background: var(--blue); text-align: center; font-weight: 700; font-size: calc(var(--u) * 1); }
  .phone .ph-log { font-family: var(--mono); font-size: calc(var(--u) * .62); line-height: 1.8; color: var(--blue-soft); padding: 0 calc(var(--u) * 1.2); white-space: pre; }
  .tag-illus { position: absolute; top: calc(var(--u) * -2.4); left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: calc(var(--u) * .62); letter-spacing: .14em; color: var(--muted); white-space: nowrap; }

  /* chapter cards */
  .chapter .cc-num { font-weight: 800; font-size: calc(var(--u) * 15); line-height: .8; letter-spacing: -.06em; color: transparent; -webkit-text-stroke: calc(var(--u) * .14) rgba(147,197,253,.75); }
  .chapter .cc-title { font-weight: 800; font-size: calc(var(--u) * 7); letter-spacing: -.055em; line-height: 1; margin: calc(var(--u) * 1.2) 0 calc(var(--u) * 1.4); }
  .chapter .cc-line { font-size: calc(var(--u) * 1.9); color: var(--text-2); margin: 0 0 calc(var(--u) * 2.4); letter-spacing: -.01em; }
  .chapter .cc-projects { display: inline-flex; gap: calc(var(--u) * .8); flex-wrap: wrap; justify-content: center; }

  /* the line diagram */
  .bigline { position: relative; height: calc(var(--u) * 18); margin: calc(var(--u) * 4) calc(var(--u) * 5) 0; }
  .bigline .track { position: absolute; left: 0; right: 0; top: calc(var(--u) * 2.2); height: calc(var(--u) * .5); border-radius: 99px; background: rgba(248,250,252,.15); }
  .bigline .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--blue-soft)); width: 0; }
  .bigline .stop { position: absolute; top: 0; transform: translateX(-50%); width: calc(var(--u) * 14); text-align: center; }
  .bigline .stop i { display: block; margin: calc(var(--u) * 1.1) auto calc(var(--u) * 1.4); width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: 50%; background: var(--night); border: calc(var(--u) * .4) solid rgba(248,250,252,.35); }
  .bigline .stop b { display: block; font-family: var(--mono); font-size: calc(var(--u) * .9); color: var(--blue-soft); letter-spacing: .1em; }
  .bigline .stop strong { display: block; font-size: calc(var(--u) * 2.1); letter-spacing: -.04em; margin: calc(var(--u) * .3) 0 calc(var(--u) * .5); }
  .bigline .stop span { display: block; font-size: calc(var(--u) * 1.05); color: var(--text-2); line-height: 1.35; }
  .bigline .bus { position: absolute; top: calc(var(--u) * .9); width: calc(var(--u) * 4.6); height: calc(var(--u) * 3); transform: translateX(-50%); border-radius: calc(var(--u) * .7); background: #fff; box-shadow: 0 0 calc(var(--u) * 2.4) rgba(147,197,253,.9); }
  .bigline .bus::before { content: ""; position: absolute; left: 10%; right: 10%; top: 20%; height: 34%; background: repeating-linear-gradient(90deg, var(--blue) 0 21%, transparent 21% 33%); }

  /* create */
  .collage { position: relative; height: calc(var(--u) * 38); }
  .card { position: absolute; border-radius: calc(var(--u) * 1); background: rgba(15,23,42,.92); border: 1px solid rgba(147,197,253,.25); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(0,0,0,.5); overflow: hidden; }
  .card .hd { font-family: var(--mono); font-size: calc(var(--u) * .7); letter-spacing: .1em; text-transform: uppercase; color: var(--blue-soft); padding: calc(var(--u) * .9) calc(var(--u) * 1.1); border-bottom: 1px solid rgba(147,197,253,.18); display: flex; justify-content: space-between; }
  .sheet table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: calc(var(--u) * .78); }
  .sheet td, .sheet th { padding: calc(var(--u) * .42) calc(var(--u) * 1.1); text-align: left; border-bottom: 1px solid rgba(248,250,252,.07); }
  .sheet th { color: var(--muted); font-weight: 400; }
  .zip ul { list-style: none; margin: 0; padding: calc(var(--u) * .7) calc(var(--u) * 1.1); font-family: var(--mono); font-size: calc(var(--u) * .8); line-height: 2; }
  .zip li::before { content: "✓"; color: var(--blue-mid); margin-right: calc(var(--u) * .7); }
  .flow-arrow { position: absolute; font-size: calc(var(--u) * 2.4); color: var(--blue-soft); }

  /* validate */
  .race { width: calc(var(--u) * 70); margin: calc(var(--u) * 2.6) auto calc(var(--u) * 2.2); text-align: left; }
  .race .rt { font-family: var(--mono); font-size: calc(var(--u) * .85); color: var(--blue-soft); margin-bottom: calc(var(--u) * 1.6); letter-spacing: .06em; }
  .lane { display: grid; grid-template-columns: calc(var(--u) * 15) 1fr calc(var(--u) * 9); align-items: center; gap: calc(var(--u) * 1.4); margin-bottom: calc(var(--u) * 1.5); font-size: calc(var(--u) * 1.3); }
  .lane .tr { height: calc(var(--u) * 2.2); border-radius: 99px; background: rgba(248,250,252,.08); overflow: hidden; }
  .lane .tr div { height: 100%; width: 0; border-radius: 99px; }
  .lane b { font-family: var(--mono); font-size: calc(var(--u) * 1.4); text-align: right; font-variant-numeric: tabular-nums; }
  .speedup { font-weight: 800; font-size: calc(var(--u) * 5.4); letter-spacing: -.05em; }
  .surfaces { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * .8); margin-bottom: calc(var(--u) * 2); }
  .surfaces div { padding: calc(var(--u) * .9) calc(var(--u) * 1.1); border-radius: calc(var(--u) * .7); background: rgba(15,23,42,.6); border: 1px solid rgba(147,197,253,.22); font-size: calc(var(--u) * 1.15); }
  .surfaces div small { display: block; font-family: var(--mono); font-size: calc(var(--u) * .66); color: var(--blue-soft); margin-top: calc(var(--u) * .2); }

  .feature { padding: calc(var(--u) * 1.8) calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1.1); background: rgba(15,23,42,.88); border: 1px solid rgba(147,197,253,.22); }
  .feature b { display: block; font-size: calc(var(--u) * 1.5); letter-spacing: -.02em; margin-bottom: calc(var(--u) * .6); }

  .pipe { position: relative; display: flex; justify-content: space-between; align-items: center; margin: calc(var(--u) * 4) 0 calc(var(--u) * 3.4); }
  .pipe .node { position: relative; z-index: 1; width: calc(var(--u) * 13.4); padding: calc(var(--u) * 1.6) calc(var(--u) * 1); border-radius: calc(var(--u) * 1.1); background: rgba(15,23,42,.95); border: 1px solid rgba(147,197,253,.3); }
  .pipe .node b { display: block; font-size: calc(var(--u) * 1.35); letter-spacing: -.02em; margin-bottom: calc(var(--u) * .5); }
  .pipe .node span { font-size: calc(var(--u) * .95); color: var(--text-2); line-height: 1.4; display: block; }
  .pipe .node em { display: block; font-style: normal; font-family: var(--mono); font-size: calc(var(--u) * .7); color: var(--blue-soft); margin-bottom: calc(var(--u) * .7); letter-spacing: .1em; }
  .pipe .wire { position: absolute; left: calc(var(--u) * 6); right: calc(var(--u) * 6); top: 50%; height: 2px; background: rgba(147,197,253,.35); }
  .pipe .pkt { position: absolute; top: 50%; width: calc(var(--u) * .9); height: calc(var(--u) * .9); margin: calc(var(--u) * -.45) 0 0 calc(var(--u) * -.45); border-radius: 50%; background: #fff; box-shadow: 0 0 calc(var(--u) * 1) var(--blue-mid); }

  table.tt td { padding: calc(var(--u) * .55) calc(var(--u) * .8) calc(var(--u) * .55) 0; border-top: 1px solid rgba(248,250,252,.1); font-variant-numeric: tabular-nums; }

  .prow .rn { height: calc(var(--u) * 2.4); border-radius: calc(var(--u) * .5); background: var(--ink); color: var(--on-light); font-weight: 800; display: grid; place-items: center; font-size: calc(var(--u) * 1.2); }

  .legend i { display: inline-block; width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 2px; margin-right: calc(var(--u) * .5); vertical-align: -1px; }

  /* move */
  .chart { padding: calc(var(--u) * 1.8); border-radius: calc(var(--u) * 1.2); background: rgba(15,23,42,.92); border: 1px solid rgba(147,197,253,.22); }
  .chart .hd { font-family: var(--mono); font-size: calc(var(--u) * .74); color: var(--blue-soft); letter-spacing: .1em; text-transform: uppercase; margin-bottom: calc(var(--u) * 1.4); }
  .hours { display: flex; align-items: flex-end; gap: calc(var(--u) * .35); height: calc(var(--u) * 14); }
  .hours div { flex: 1; background: linear-gradient(180deg, var(--blue-soft), var(--blue)); border-radius: calc(var(--u) * .25) calc(var(--u) * .25) 0 0; height: 0; }
  .hours-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: calc(var(--u) * .66); color: var(--muted); margin-top: calc(var(--u) * .5); }
  .days { display: flex; gap: calc(var(--u) * .6); margin-top: calc(var(--u) * 1.8); }
  .days div { flex: 1; text-align: center; padding: calc(var(--u) * .7) 0; border-radius: calc(var(--u) * .6); background: rgba(248,250,252,.06); }
  .days b { display: block; font-size: calc(var(--u) * 1.3); font-variant-numeric: tabular-nums; }
  .days span { font-family: var(--mono); font-size: calc(var(--u) * .62); color: var(--muted); }
  .flow { display: flex; flex-direction: column; gap: calc(var(--u) * 1); }
  .flow .fs { display: grid; grid-template-columns: calc(var(--u) * 3.4) 1fr; gap: calc(var(--u) * 1.2); align-items: center; padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4); border-radius: calc(var(--u) * 1); background: rgba(15,23,42,.9); border: 1px solid rgba(147,197,253,.22); }
  .flow .fs i { width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); border-radius: calc(var(--u) * .8); background: var(--blue); display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-weight: 600; font-size: calc(var(--u) * 1.1); }
  .flow .fs b { display: block; font-size: calc(var(--u) * 1.3); letter-spacing: -.02em; }
  .flow .fs span { font-size: calc(var(--u) * .98); color: var(--text-2); }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * .5); margin: calc(var(--u) * .4) calc(var(--u) * .9); }
  .slots span { text-align: center; padding: calc(var(--u) * .65) 0; border-radius: calc(var(--u) * .6); background: rgba(248,250,252,.07); font-family: var(--mono); font-size: calc(var(--u) * .8); }
  .slots span.on { background: var(--blue); color: #fff; font-weight: 600; }
  .ring { position: relative; width: calc(var(--u) * 36); height: calc(var(--u) * 36); margin: 0 auto; }
  .ring .core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(var(--u) * 13); height: calc(var(--u) * 13); border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--blue), var(--blue-deep)); display: grid; place-items: center; text-align: center; font-weight: 800; font-size: calc(var(--u) * 1.7); letter-spacing: -.03em; box-shadow: 0 0 calc(var(--u) * 5) rgba(10,92,255,.5); }
  .ring .mod { position: absolute; transform: translate(-50%, -50%); width: calc(var(--u) * 12); }
  .ring .mod > div { padding: calc(var(--u) * 1) calc(var(--u) * .8); border-radius: calc(var(--u) * .9); background: rgba(15,23,42,.94); border: 1px solid rgba(147,197,253,.3); text-align: center; font-size: calc(var(--u) * 1.08); font-weight: 600; }
  .ring svg { position: absolute; inset: 0; }

  /* finale */
  .city { position: absolute; left: calc(var(--u) * 5); bottom: calc(var(--u) * 12); font-weight: 800; font-size: calc(var(--u) * 7); letter-spacing: -.055em; }
  .recap { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * .9); margin: calc(var(--u) * 2.4) 0 calc(var(--u) * 1.6); text-align: left; }
  .recap div { padding: calc(var(--u) * 1.1) calc(var(--u) * 1.2); border-radius: calc(var(--u) * 1); background: rgba(15,23,42,.9); border: 1px solid rgba(147,197,253,.22); }
  .recap small { font-family: var(--mono); font-size: calc(var(--u) * .64); color: var(--blue-soft); letter-spacing: .12em; text-transform: uppercase; }
  .recap b { display: block; font-size: calc(var(--u) * 1.4); letter-spacing: -.025em; margin: calc(var(--u) * .4) 0 calc(var(--u) * .3); }
  .recap span { font-size: calc(var(--u) * .92); color: var(--text-2); line-height: 1.35; display: block; }
  .qrcard { display: inline-flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .8); padding: calc(var(--u) * 1.2); border-radius: calc(var(--u) * 1.4); background: #fff; color: var(--on-light); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.45); }
  .qrcard img { width: calc(var(--u) * 15); height: calc(var(--u) * 15); display: block; }
  .qrcard b { font-size: calc(var(--u) * 1.25); letter-spacing: -.02em; }
  .qrcard span { font-family: var(--mono); font-size: calc(var(--u) * .7); color: #475569; margin-top: calc(var(--u) * -.6); }
  .qrs { display: flex; gap: calc(var(--u) * 3); justify-content: center; margin-top: calc(var(--u) * 1); }
  .mini-game { padding: calc(var(--u) * .8) calc(var(--u) * .9); }
  .mini-game .tk { display: flex; border-radius: calc(var(--u) * .8); overflow: hidden; background: #fff; color: var(--on-light); margin-bottom: calc(var(--u) * 1.6); }
  .mini-game .tk b { background: var(--blue); color: #fff; font-size: calc(var(--u) * 2); padding: calc(var(--u) * .5) calc(var(--u) * .9); }
  .mini-game .tk span { padding: calc(var(--u) * .6) calc(var(--u) * .7); font-size: calc(var(--u) * .78); font-weight: 600; line-height: 1.3; flex: 1; }
  .mini-game .tk em { font-style: normal; background: var(--blue-deep); color: #fff; padding: calc(var(--u) * .5) calc(var(--u) * .7); font-weight: 800; font-size: calc(var(--u) * 1.3); display: grid; place-items: center; }
  .mini-game .q { font-size: calc(var(--u) * .9); text-align: center; margin-bottom: calc(var(--u) * .8); color: var(--text-2); }
  .mini-game .g { text-align: center; font-weight: 800; font-size: calc(var(--u) * 2.2); font-variant-numeric: tabular-nums; margin-bottom: calc(var(--u) * 1.4); }
  .mini-game .ax { position: relative; height: calc(var(--u) * 1); border-radius: 99px; background: linear-gradient(90deg, #dbeafe, #60a5fa, #0a5cff); opacity: .5; margin: calc(var(--u) * 2.4) 0 calc(var(--u) * 2.2); }
  .mini-game .mk { position: absolute; top: 50%; width: calc(var(--u) * 2); height: calc(var(--u) * 2); margin: calc(var(--u) * -1) 0 0 calc(var(--u) * -1); border-radius: 50%; }
  .mini-game .btn { text-align: center; padding: calc(var(--u) * .9) 0; border-radius: 99px; background: var(--blue); font-weight: 700; font-size: calc(var(--u) * .95); }
</style>

<body>
<canvas id="map"></canvas>
<div id="veil"></div>
<div id="shade"></div>
<div id="edge"></div>
<header>
  <img class="logo" src="../assets/abasis-logo-white.svg" alt="Abasis.AI">
  <nav id="line"><div class="rail"></div></nav>
  <div id="clock"></div>
</header>
<main id="stage"></main>
<aside id="qr"><img src="../assets/qr-play.svg" alt="QR code: play Beat the Bus"><div><b>Play Beat the Bus</b><span>Scan with your phone</span></div></aside>
<footer id="progress"></footer>
<div id="hint">SPACE pause · ← → scenes · 1–6 chapters · F fullscreen</div>

<script src="../data/network.js"></script>
<script src="../data/overlays.js"></script>
<script src="../data/timetable.js"></script>
<script src="../data/projects.js"></script>
<script src="../map.js"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const P = new URLSearchParams(location.search);
  const RENDER = P.has('render');
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const hhmm = s => { const m = Math.round(s / 60); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const O = window.OVERLAYS, C = window.NETWORK.counts, TT = window.TIMETABLE, CH = window.CHAPTERS;
  const PR = Object.fromEntries(window.PROJECTS.map(p => [p.id, p]));
  const MOF = O.places.mof;

  const map = createMap($('#map'), window.NETWORK, { overlays: { kapnos: O.kapnos, limassol: O.limassol } });
  const GHOST = map.nicosiaShape(MOF);

  // ---------- camera targets (depend on screen aspect, so recomputed on resize) ----------
  let CAM = {};
  function computeCams() {
    const right = { left: .5, right: .95, top: .17, bottom: .86 };
    const b = map.bounds;
    CAM = {
      island: map.fit(b.island, { left: .04, right: .96, top: .14, bottom: .9 }),
      islandRight: map.fit(b.island, { left: .38, right: .98, top: .2, bottom: .88 }),
      islandWide: map.fit(b.island, { left: .3, right: 1.02, top: .12, bottom: .92 }),
      mof: map.point(MOF.x, MOF.y, 820, { fx: .7, fy: .52 }),
      nicosia: map.fit(b.Nicosia, right),
      nicosiaWide: map.fit(b.Nicosia, { left: .25, right: .98, top: .12, bottom: .92 }),
      limassol: map.fit(b.Limassol, { left: .3, right: .98, top: .14, bottom: .9 }),
      kapnos: map.fit(map.feeds.kapnos.bounds, { left: .5, right: .93, top: .2, bottom: .84 }),
      shuttle: map.fit(map.feeds.limassol.bounds, { left: .5, right: .93, top: .24, bottom: .8 }),
      school: map.fit(map.schoolBounds(), { left: .48, right: .76, top: .2, bottom: .84 }),
      ghost: map.fit(map.lineBounds(GHOST), { left: .52, right: .94, top: .2, bottom: .84 }),
      Nicosia: map.fit(b.Nicosia, { left: .25, right: .97, top: .14, bottom: .9 }),
      Larnaca: map.fit(b.Larnaca, { left: .25, right: .97, top: .14, bottom: .9 }),
      Paphos: map.fit(b.Paphos, { left: .25, right: .97, top: .14, bottom: .9 }),
      Famagusta: map.fit(b.Famagusta, { left: .25, right: .97, top: .14, bottom: .9 }),
      Limassol: map.fit(b.Limassol, { left: .25, right: .97, top: .14, bottom: .9 })
    };
  }
  computeCams();

  // ---------- reusable markup ----------
  const steps = (list, start, gap = 650) => `<ol class="steps">${list.map((s, i) => `<li data-in="${start + i * gap}">${s}</li>`).join('')}</ol>`;
  const stats = (list, at) => `<div class="stats" data-in="${at}">${list.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
  const kick = (text, at = 200) => `<div class="kicker" data-in="${at}">${text}</div>`;
  const browser = (url, inner, at = 600, fx = 'tilt') => `<div class="browser" data-in="${at}" data-fx="${fx}"><div class="bar"><i></i><i></i><i></i><span>${url}</span></div><div class="view">${inner}</div></div>`;
  const chapterCard = (i, projects) => ({
    id: CH[i].id + '-card', ch: i, dur: 8000, veil: 0, shade: .55, speed: .6,
    html: `<div class="center chapter">
      <div class="cc-num" data-in="100" data-fx="scale">${CH[i].n}</div>
      <div class="cc-title" data-in="350">${CH[i].title}</div>
      <p class="cc-line" data-in="900">${CH[i].line}</p>
      <div class="cc-projects" data-in="1500">${projects.map(p => `<span class="pill">${p}</span>`).join('')}</div>
    </div>`
  });

  // kapnos mini map as inline SVG (real route shapes)
  const kapnosSvg = (() => {
    const b = map.feeds.kapnos.bounds, pad = 120, w = b[2] - b[0] + pad * 2, h = b[3] - b[1] + pad * 2;
    const lines = O.kapnos.lines.map(l => { let d = ''; for (let i = 0; i < l.p.length; i += 2) d += (i ? 'L' : 'M') + (l.p[i] - b[0] + pad) + ' ' + (l.p[i + 1] - b[1] + pad); return `<path d="${d}"/>`; }).join('');
    const stops = O.kapnos.stops.map(s => `<circle cx="${s.x - b[0] + pad}" cy="${s.y - b[1] + pad}" r="52"/>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;display:block"><g fill="none" stroke="#93c5fd" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity=".9">${lines}</g><g fill="#0a5cff" stroke="#fff" stroke-width="14">${stops}</g></svg>`;
  })();
  const kSample = O.kapnos.sample.departures.filter(r => r.dep >= '07:00').slice(0, 7);

  // route 11 at Ministry of Finance: published vs typical observed (real data)
  const ttRows = TT.rows.filter(r => r.route_short_name === '11' && r.sufficient_history && r.scheduled_seconds >= 6 * 3600).slice(0, 7);
  const sign = m => (m < 0 ? '−' : '+') + Math.abs(m).toFixed(1);
  const punct = [...O.punctuality.routes].sort((a, b) => b.within - a.within);
  const bike = O.bikestat, hmax = Math.max(...bike.hourly);

  // ---------- the show ----------
  const FULL = [
    { id: 'open', ch: -1, dur: 15000, veil: 1, shade: 0, cam: [[0, 'prev'], [2200, 'islandRight']],
      map: t => ({ reveal: clamp(t / 7000), busAlpha: clamp((t - 6500) / 1500) }),
      html: `<div class="col-left">
        ${kick('Abasis.AI · Mobility Lab · Nicosia', 300)}
        <h1 data-in="600">Cyprus<br>in <em>motion.</em></h1>
        <p class="lede" data-in="1500">We build the data tools that make public transport easier to plan, check and trust.</p>
        <div class="stats" data-in="2400">
          <div class="stat"><b data-count="${C.routes}" data-at="2400">0</b><span>bus routes</span></div>
          <div class="stat"><b data-count="${C.stops}" data-at="2400">0</b><span>stops</span></div>
          <div class="stat"><b data-count="${C.trips}" data-at="2400">0</b><span>scheduled trips</span></div>
        </div>
        <div class="note" data-in="4200">Every line on this map is a real route shape from the public GTFS feeds of Cyprus’s 7 bus operators.</div>
      </div>` },

    { id: 'archive', ch: -1, dur: 13000, veil: 1, shade: 0, speed: 5, cam: [[0, 'prev'], [11000, 'islandWide']],
      html: `<div class="col-left">
        ${kick('The archive · since 21 July 2026')}
        <div class="mega" data-in="400"><span data-count="51698134" data-at="600" data-dur="5200">0</span></div>
        <div class="mega-sub" data-in="700">bus GPS positions recorded</div>
        <p class="lede" data-in="1600">Every public bus in Cyprus, every 30 seconds. From those points we rebuild what actually happened at each stop.</p>
        ${stats([['11.9M', 'stop passages'], ['98', 'service days'], ['7', 'operators']], 2600)}
      </div>` },

    { id: 'truth', ch: -1, dur: 16000, veil: 1, shade: 0, speed: .6, cam: [[0, 'prev'], [3400, 'mof']],
      map: t => ({ focus: 'Nicosia', pulse: { x: MOF.x, y: MOF.y, alpha: clamp((t - 2000) / 800) },
        labels: [{ x: MOF.x, y: MOF.y, text: 'Ministry of Finance stop', size: 16, dx: 22, alpha: clamp((t - 2800) / 700) }] }),
      html: `<div class="col-left">
        ${kick('One stop · eight Mondays')}
        <h2 data-in="400">The timetable says 07:00.<br><em>The bus says…</em></h2>
        <p class="lede" data-in="1400">Ministry of Finance, Nicosia: 1,174 GPS-observed passages compared with the published times.</p>
        <div class="split" data-in="3000"><div data-bar="${O.punctuality.overall.within}" data-at="3200" style="background:var(--blue);color:#fff">${Math.round(O.punctuality.overall.within)}% on time</div><div data-bar="${O.punctuality.overall.late}" data-at="3500" style="background:var(--blue-soft)">${Math.round(O.punctuality.overall.late)}% late</div><div data-bar="${O.punctuality.overall.early}" data-at="3800" style="background:var(--blue-pale)">${Math.round(O.punctuality.overall.early)}%</div></div>
        <div class="legend" data-in="3600"><span><i style="background:var(--blue)"></i>−1 to +5 min</span><span><i style="background:var(--blue-soft)"></i>over 5 min late</span><span><i style="background:var(--blue-pale)"></i>over 1 min early</span></div>
        <div class="note" data-in="4600">Median delay ${O.punctuality.overall.median.toFixed(1)} min · Sept 7 – Oct 26, 2026 · GPS passages are not boarding records</div>
      </div>` },

    { id: 'line', ch: -1, dur: 12500, veil: 0, shade: .62, speed: .8, cam: [[0, 'prev'], [3000, 'island']],
      html: `<div class="center">
        ${kick('How we work', 200)}
        <h2 data-in="400">Six stops. <em>One line.</em></h2>
        <div class="bigline" data-in="900">
          <div class="track"><div class="fill"></div></div>
          ${CH.map((c, i) => `<div class="stop" style="left:${i * 20}%"><i></i><b>${c.n}</b><strong>${c.title}</strong><span>${['Spreadsheet → standard feed', 'Errors caught before riders see them', 'Live buses from a phone', 'Fill the GPS gaps', 'What really happens', 'Cars, bikes, exams & AI'][i]}</span></div>`).join('')}
          <div class="bus"></div>
        </div>
      </div>`,
      update(t, root) {
        const k = ease(clamp((t - 1700) / 8600));
        root.querySelector('.bigline .bus').style.left = (k * 100) + '%';
        root.querySelector('.bigline .fill').style.width = (k * 100) + '%';
        root.querySelectorAll('.bigline .stop i').forEach((el, i) => {
          const lit = k * 5 >= i - .02;
          el.style.background = lit ? 'var(--blue)' : 'var(--night)';
          el.style.borderColor = lit ? 'var(--blue-soft)' : 'rgba(248,250,252,.35)';
        });
      } },

    // 01 CREATE
    chapterCard(0, ['GTFS Web Editor', 'Kapnos Airport Shuttle', 'Limassol Airport Express']),
    { id: 'kapnos-how', ch: 0, dur: 13500, veil: 1, shade: .2, speed: .6, cam: [[0, 'prev'], [4000, 'kapnos']],
      map: () => ({ dim: .45, busAlpha: .3 }),
      html: `<div class="col-left">
        ${kick('Create · GTFS Web Editor')}
        <h2 data-in="400">From spreadsheet<br>to <em>standard feed.</em></h2>
        <p class="lede" data-in="1100">${PR.kapnos.problem}</p>
        ${steps(PR.kapnos.steps, 2200)}
      </div>
      <div class="col-right"><div class="collage">
        <div class="card sheet" data-in="1400" data-fx="left" style="left:0;top:0;width:calc(var(--u)*21)">
          <div class="hd"><span>R1 · Nicosia → Larnaca Airport</span><span>Mon 6 Jul</span></div>
          <table><tr><th>depart</th><th>arrive</th><th>stop</th></tr>${kSample.map(r => `<tr><td>${r.dep}</td><td>${r.arr}</td><td>LCA</td></tr>`).join('')}</table>
        </div>
        <div class="flow-arrow" data-in="2600" style="left:calc(var(--u)*22.4);top:calc(var(--u)*8)">→</div>
        <div class="card" data-in="2900" data-fx="scale" style="right:0;top:calc(var(--u)*3);width:calc(var(--u)*23)">
          <div class="hd"><span>Map editor</span><span>4 routes · 12 stops</span></div>
          <div style="padding:calc(var(--u)*1)">${kapnosSvg}</div>
        </div>
        <div class="flow-arrow" data-in="4200" style="left:calc(var(--u)*20);top:calc(var(--u)*25)">↙</div>
        <div class="card zip" data-in="4500" data-fx="up" style="left:calc(var(--u)*4);top:calc(var(--u)*24);width:calc(var(--u)*17)">
          <div class="hd"><span>kapnos_gtfs.zip</span><span>✓ valid</span></div>
          <ul>${['agency.txt', 'stops.txt', 'routes.txt', 'trips.txt', 'stop_times.txt', 'shapes.txt'].map((f, i) => `<li data-in="${4900 + i * 260}">${f}</li>`).join('')}</ul>
        </div>
      </div></div>` },
    { id: 'editor-clip', ch: 0, dur: 28500, veil: 1, shade: .35, speed: .5, cam: [[0, 'prev'], [3000, 'islandWide']],
      map: () => ({ dim: .6 }),
      html: `<div class="col-left" style="width:calc(var(--u)*36)">
        ${kick('Create · GTFS Web Editor')}
        <h2 data-in="400">Edit on a map. <em>Check before you publish.</em></h2>
        <ol class="steps"><li data-in="3100">Every route and stop on a real map</li><li data-in="5000">Edit, reshape or clone a route in two clicks</li><li data-in="12300">Weekly timetables — one tick per day</li><li data-in="23600">A built-in feed health check before export</li></ol>
      </div>
      <div class="col-right" style="width:calc(var(--u)*52)">
        ${browser('Transit Editor', `<video data-clip data-at="900" muted playsinline preload="auto" src="../media/gtfs-editor.mp4"></video>`, 600)}

  }
  function animate(t, dur) {
    for (const el of root._anims) {
      const tin = +el.dataset.in;
      const a = easeOut(clamp((t - tin) / 750));
      const out = el.dataset.out ? +el.dataset.out : dur - 700;
      const b = ease(clamp((t - out) / 550));
      el.style.opacity = (a * (1 - b)).toFixed(3);
      const fx = el.dataset.fx || 'up';
      const u = `min(1vw, 1.7778vh)`;
      el.style.transform =
        fx === 'scale' ? `scale(${.92 + .08 * a - .03 * b})` :
        fx === 'left' ? `translateX(calc(${u} * ${(-(1 - a) * 3).toFixed(3)}))` :
        fx === 'tilt' ? `perspective(calc(${u} * 160)) rotateY(${(-16 * (1 - a) - 5).toFixed(2)}deg) translateY(calc(${u} * ${((1 - a) * 2).toFixed(3)}))` :
        `translateY(calc(${u} * ${((1 - a) * 1.8 - b * 1).toFixed(3)}))`;
    }
    for (const el of root._counts) {
      const at = +(el.dataset.at || 0), d = +(el.dataset.dur || 1800), to = +el.dataset.count, dec = +(el.dataset.dec || 0);
      const k = 1 - Math.pow(1 - clamp((t - at) / d), 4);
      el.textContent = dec ? (to * k).toFixed(dec) : fmt(to * k);
    }
    for (const el of root._bars) el.style.width = (+el.dataset.bar * easeOut(clamp((t - +(el.dataset.at || 0)) / 1300))) + '%';
    for (const el of root._hbars) el.style.height = (+el.dataset.hbar * easeOut(clamp((t - +(el.dataset.at || 0)) / 900))) + '%';
    for (const el of root._kb) { const k = clamp(t / dur); el.style.transform = el.dataset.kb === 'out' ? `scale(${1.1 - .08 * k})` : `scale(${1.02 + .08 * k}) translateY(${-k * 2}%)`; el.style.transformOrigin = '50% 20%'; }
  }
  // render mode: load → seek → wait until that exact frame is composited (with time-outs so nothing hangs)
  const once = (el, ev, ms) => new Promise(r => { const done = () => { clearTimeout(id); r(); }; const id = setTimeout(done, ms); el.addEventListener(ev, done, { once: true }); });
  async function seekExact(v, target) {
    if (v.readyState < 2) await once(v, 'loadeddata', 8000);
    const dur = isFinite(v.duration) ? v.duration : 1e9, want = Math.min(target, dur - .04);
    if (Math.abs(v.currentTime - want) <= .004) return;
    const seeked = once(v, 'seeked', 3000);
    v.currentTime = want;
    await seeked;
    if (v.requestVideoFrameCallback) await Promise.race([new Promise(r => v.requestVideoFrameCallback(() => r())), new Promise(r => setTimeout(r, 400))]);
  }
  function syncVideos(t) {
    const waits = [];
    for (const v of root._videos) {
      const at = +(v.dataset.at || 0), target = Math.max(0, (t - at) / 1000);
      if (RENDER) waits.push(seekExact(v, target));
      else if (t >= at && v.paused && !v.ended && !paused) {
        if (Math.abs(v.currentTime - target) > .3) v.currentTime = target;
        v.play().catch(() => {});
      }
    }
    return Promise.all(waits);
  }

  function frame(Gabs) {
    const loops = Math.floor(Gabs / TOTAL), G = Gabs - loops * TOTAL;
    const i = idxAt(G), sc = SCENES[i], t = G - START[i];
    if (i !== curIdx) build(i);
    const st = mapState(i, t);
    st.cam = camAt(i, t);
    st.tau = loops * TAU_TOTAL + TAU0[i] + (sc.speed ?? 1) * t / 1000;
    st.time = Gabs;
    map.draw(st);
    animate(t, sc.dur);
    if (sc.update) sc.update(t, root);
    chrome(i, t, G);
    return syncVideos(t);
  }

  // ---------- live playback ----------
  let paused = false, origin = performance.now(), pausedAt = 0;
  const startAt = P.has('t') ? +P.get('t') * 1000 : P.has('scene') ? START[Math.max(0, SCENES.findIndex(s => s.id === P.get('scene')))] || 0 : 0;
  origin -= startAt;
  const now = () => paused ? pausedAt : performance.now() - origin;
  const seek = ms => { const n = now(); origin += n - ms; if (paused) pausedAt = ms; };

  if (RENDER) {
    $('#hint').remove();
    window.__show = {
      total: TOTAL, fps: 30,
      scenes: SCENES.map((s, i) => ({ id: s.id, start: START[i], dur: s.dur })),
      ready: document.fonts.ready,
      async render(ms) {
        await frame(ms);
        await Promise.all([...root.querySelectorAll('img')].map(img => img.decode().catch(() => {})));
        return true;
      }
    };
  } else {
    const loop = () => { frame(now()); requestAnimationFrame(loop); };
    document.fonts.ready.then(() => requestAnimationFrame(loop));
    const clock = () => { $('#clock').innerHTML = `<span class="live">LIVE</span><span>${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Nicosia' })} NICOSIA</span>`; };
    clock(); setInterval(clock, 10000);
    addEventListener('keydown', e => {
      const G = now() % TOTAL, i = idxAt(G);
      if (e.key === ' ') {
        paused = !paused; if (paused) pausedAt = performance.now() - origin; else origin = performance.now() - pausedAt;
        document.body.classList.toggle('paused', paused);
        root && root._videos.forEach(v => paused ? v.pause() : null);
        e.preventDefault();
      }
      if (e.key === 'ArrowRight') seek(now() - G + START[(i + 1) % SCENES.length] + (i === SCENES.length - 1 ? TOTAL : 0));
      if (e.key === 'ArrowLeft') seek(now() - G + START[(i - 1 + SCENES.length) % SCENES.length] - (i === 0 ? TOTAL : 0));
      if (e.key === 'Home') seek(0);
      if (/^[1-6]$/.test(e.key)) seek(now() - G + chapterStart(+e.key - 1));
      if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    });
    let hide;
    addEventListener('mousemove', () => { document.body.classList.add('cursor'); clearTimeout(hide); hide = setTimeout(() => document.body.classList.remove('cursor'), 2500); });
    addEventListener('dblclick', () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());
  }
  window.__showInfo = { total: TOTAL, scenes: SCENES.map((s, i) => ({ id: s.id, ch: s.ch, start: START[i], dur: s.dur })) };
})();
</script>
</body>
</html>
